mainSections = ["post"]
# 本地预览及头像下载失败时使用此图标；GitHub Pages 部署时自动使用仓库所有者头像。
favicon = "img/favicon.svg"

[sidebar]
  # 留空时不显示头像；可填写图片 URL，或 assets 下的路径（如 img/avatar.png）。
  avatar = ""

[article]
  toc = true
  readingTime = true
  math = true

  [article.list]
  showTags = true

[widgets]
  homepage = [{ type = "archives", params = { limit = 5 } }]
  page = [{ type = "toc" }]

[comments]
  enabled = false

[dateFormat]
  published = "2006-01-02"
  lastUpdated = "2006-01-02"
